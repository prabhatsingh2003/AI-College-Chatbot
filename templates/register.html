<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient( 135deg, #4f46e5, #7c3aed);
        }
        
        .register-box {
            width: 420px;
            max-width: 95%;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }
        
        .icon {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }
        
        h2 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 8px;
        }
        
        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
        }
        
        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
        }
        
        input:focus {
            border-color: #4f46e5;
        }
        
        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        
        button:hover {
            background: #4338ca;
        }
        
        .error {
            color: #dc2626;
            background: #fee2e2;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .success {
            color: #166534;
            background: #dcfce7;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .login-link a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="register-box">

        <div class="icon">
            🎓
        </div>

        <h2>
            Student Registration
        </h2>

        <p class="subtitle">
            Create your account to use AI College Assistant
        </p>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %} {% if success %}

        <div class="success">
            {{ success }}
        </div>

        {% endif %}

        <form method="POST">

            <input type="text" name="name" placeholder="Full Name" required>

            <input type="email" name="email" placeholder="Email Address" required>

            <input type="password" name="password" placeholder="Password" required>

            <input type="password" name="confirm_password" placeholder="Confirm Password" required>

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="login-link">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</body>

</html>
