<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
        }
        
        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }
        
        .icon {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }
        
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #1f2937;
        }
        
        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
        }
        
        input:focus {
            border-color: #4f46e5;
        }
        
        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        
        button:hover {
            background: #4338ca;
        }
        
        .error {
            color: #dc2626;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>

</head>

<body>

    <div class="login-box">

        <div class="icon">🔐</div>

        <h2>Admin Login</h2>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            <input type="text" name="username" placeholder="Username" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
